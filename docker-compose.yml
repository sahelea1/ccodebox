# ccodebox / detached-persistent
#
# One service. One named volume. State persists across:
#   docker compose stop / start
#   docker compose down              (removes the container, keeps the volume)
#   host reboots
#
# State is wiped only by:
#   docker compose down -v           (-v removes named volumes)
#   docker volume rm ccodebox_data   (explicit destroy)

services:
  ccodebox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ccodebox
    restart: unless-stopped
    ports:
      # Host port : container port. Override with PORT=9000 docker compose up -d.
      - "0.0.0.0:7878:7878"
    environment:
      # OLLAMA_API_KEY is read from .env (gitignored). The .env.example file
      # documents the required name. Never commit the value.
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      # ANTHROPIC_API_KEY for the Claude Code CLI (optional — Claude Code can
      # also auth interactively via `claude login` and the resulting token is
      # persisted under /data/claude).
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENCODE_PORT: "7878"
      OPENCODE_HOSTNAME: "0.0.0.0"
    volumes:
      - ./workspace:/data
      - ./claude-config:/root/.claude
      - ./opencode-config:/root/.config/opencode
      - ~/.ssh:/root/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
